[project]
name = "vector-pilot-alan-vo"
version = "1.0.0"
description = "Evaluation framework for AI agent reasoning and model quality"
readme = "README.md"
license = {text = "MIT"}
authors = [
  {name = "Alan Vo", email = "alanvo@gmail.com"}
]
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.0",
  "uvicorn[standard]==0.32.0",
  "sqlalchemy==2.0.36",
  "pydantic==2.10.1",
  "pydantic-settings==2.6.1",
  "python-jose[cryptography]==3.3.0",
  "httpx==0.27.2",
  "python-multipart==0.0.9",
  "aiosqlite==0.20.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "pytest-asyncio==0.23.7",
  "httpx==0.27.2",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"